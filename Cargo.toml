[package]
name = "polyglot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "polyglot"
path = "cli/src/main.rs"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
