[project]
# Locked development-environment identifier, not an installed runtime package.
name = "pylearn"
version = "0.1.0"
description = "Python development tooling for the shared Polyglot Rust CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jamal Dawson" }
]
dependencies = [
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-vv --strict-markers --maxfail=1 --durations=5 --disable-warnings"
# Full stack traces
# addopts = "-vv -s --strict-markers …"
# Show absolute test paths
# addopts = "-vv --full-trace --verbose --show-capture=all"
# strict
# addopts = "-vv --strict-markers --strict-config"
testpaths = [
    "tests"
]
python_files = [
    "test_*.py",
    "*_test.py"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
